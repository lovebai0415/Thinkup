<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>THINK</title>
<style>
  :root{
    --paper:#f5eee0;
    --paper-deep:#e8dfcc;
    --paper-back:#efe6d2;
    --ink:#1a1614;
    --ink-mid:rgba(26,22,20,.62);
    --ink-soft:rgba(26,22,20,.38);
    --ink-line:rgba(26,22,20,.16);
    --cinnabar:#a63327;
    --cinnabar-soft:rgba(166,51,39,.15);
    --gold:#8a6a3b;
    --serif:"Songti SC","STSong","SimSun","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    --symbol:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols 2","Arial Unicode MS",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background-color:var(--paper-deep);
    background-image:
      radial-gradient(circle at 18% 26%, rgba(139,107,63,.07) 0%, transparent 22%),
      radial-gradient(circle at 82% 68%, rgba(139,107,63,.06) 0%, transparent 24%),
      radial-gradient(circle at 62% 16%, rgba(139,107,63,.04) 0%, transparent 18%),
      radial-gradient(circle at 28% 84%, rgba(139,107,63,.05) 0%, transparent 20%),
      radial-gradient(circle at 90% 20%, rgba(166,51,39,.03) 0%, transparent 16%);
    overflow:hidden;
  }
  .app{
    width:100%; max-width:620px; margin:0 auto;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    background:var(--paper);
    border-left:1px solid var(--ink-line);
    border-right:1px solid var(--ink-line);
    position:relative;
    overflow:hidden;
  }

  /* 背景文字：从标题下方开始，不覆盖标题区 */
  .bg-phrase{
    position:absolute;
    left:0; right:0; bottom:0;
    top:210px;
    pointer-events:none;
    z-index:0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:20px 14px;
    font-family:var(--serif);
    font-weight:700;
    color:var(--cinnabar);
    opacity:0.5;
    user-select:none;
    overflow:hidden;
  }
  .bg-phrase span{
    writing-mode:vertical-rl;
    text-orientation:upright;
    font-size:clamp(46px, 11vw, 84px);
    letter-spacing:.12em;
    line-height:1;
    white-space:nowrap;
  }

  header{
    position:relative;
    z-index:2;
    padding:22px 24px 20px;
    text-align:center;
    border-bottom:1px solid var(--ink-line);
  }
  header::after{
    content:"";
    position:absolute; left:24px; right:24px; bottom:-1px; height:1px;
    background:linear-gradient(90deg, transparent, var(--cinnabar) 30%, var(--cinnabar) 70%, transparent);
    opacity:.4;
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    padding:0 2px;
    font-family:var(--serif);
    font-size:13px;
    font-weight:600;
    color:var(--cinnabar);
    opacity:.82;
    margin-bottom:26px;
  }
  .seal{
    position:absolute;
    top:50px;
    left:24px;
    width:34px; height:34px;
    display:grid; place-items:center;
    font-family:var(--serif);
    font-size:16px; font-weight:700;
    color:var(--paper);
    background:var(--cinnabar);
    border-radius:4px;
    box-shadow:0 2px 8px rgba(166,51,39,.28);
    cursor:pointer;
    z-index:5;
    transition:transform .18s, filter .18s;
    user-select:none;
  }
  .seal:hover{ filter:brightness(1.1); transform:translateY(-1px); }
  .seal:active{ transform:scale(.94); }

  header h1{
    margin:0;
    font-family:var(--serif);
    font-size:28px; font-weight:700;
    letter-spacing:.5em; text-indent:.5em;
    color:var(--ink);
  }
  .meta{
    margin:12px 0 0;
    font-family:var(--serif);
    font-size:12px;
    letter-spacing:.52em; text-indent:.52em;
    color:var(--ink-mid);
    opacity:.68;
  }
  .sub{
    margin:16px 0 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    padding:0 6px;
    font-family:var(--serif);
    font-size:9px;
    letter-spacing:.22em;
    color:var(--cinnabar);
    opacity:.85;
    text-transform:lowercase;
  }

  #chat{
    flex:1; overflow-y:auto; overscroll-behavior:contain;
    padding:24px 18px 16px;
    display:flex; flex-direction:column; gap:16px;
    scroll-behavior:smooth;
    position:relative;
    z-index:1;
  }
  #chat::-webkit-scrollbar{ width:4px; }
  #chat::-webkit-scrollbar-thumb{ background:var(--ink-soft); border-radius:2px; }
  #chat::-webkit-scrollbar-track{ background:transparent; }

  .row{ display:flex; animation:fadeUp .36s ease both; position:relative; z-index:1; }
  .row.user{ justify-content:flex-end; }
  .row.sys{ justify-content:flex-start; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(10px); }
    to  { opacity:1; transform:none; }
  }
  .bubble{
    max-width:78%;
    padding:11px 16px;
    font-size:15px; line-height:1.65;
    font-family:var(--serif);
    letter-spacing:.04em;
    word-break:break-word;
    border-radius:4px;
    color:var(--paper);
    background:var(--ink);
    border:1px solid var(--ink);
    box-shadow:0 4px 14px rgba(26,22,20,.18);
  }
  .hint{
    max-width:94%;
    padding:14px 18px;
    font-size:13px; line-height:1.95;
    font-family:var(--serif);
    letter-spacing:.06em;
    color:var(--ink-mid);
    border-radius:4px;
    background:rgba(245,238,224,.85);
    border:1px solid var(--ink-line);
    border-left:3px solid var(--cinnabar);
    backdrop-filter:blur(2px);
  }
  .hint b{ color:var(--cinnabar); font-weight:700; }

  .notice{
    max-width:94%;
    padding:11px 16px;
    font-size:12px; line-height:1.7;
    font-family:var(--serif);
    letter-spacing:.08em;
    color:var(--cinnabar);
    border-radius:4px;
    background:rgba(245,238,224,.88);
    border:1px dashed var(--cinnabar);
    align-self:center;
    text-align:center;
  }
  .notice b{ font-weight:700; }

  .err{
    max-width:94%;
    padding:12px 16px;
    font-size:12px; line-height:1.7;
    color:var(--cinnabar);
    border-radius:4px;
    background:var(--cinnabar-soft);
    border:1px solid rgba(166,51,39,.3);
    word-break:break-all;
  }
  .typing{
    display:flex; gap:5px; align-items:center;
    padding:14px 18px;
    border-radius:4px;
    background:rgba(245,238,224,.85);
    border:1px solid var(--ink-line);
    border-left:3px solid var(--cinnabar);
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--cinnabar); opacity:.35;
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{
    0%,80%,100%{ opacity:.2; transform:scale(.85); }
    40%{ opacity:1; transform:scale(1); }
  }
  .cards{
    display:flex; flex-wrap:wrap; gap:12px;
    align-items:flex-start;
  }
  .card-slot{
    --d:0s;
    width:156px;
    height:256px;
    perspective:1100px;
    animation:cardIn .5s ease both;
    animation-delay:var(--d);
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(14px) rotate(-1deg); }
    to  { opacity:1; transform:none; }
  }
  .card-slot.flippable{ cursor:pointer; }
  .card-slot.flippable .card-inner{
    position:relative;
    width:100%; height:100%;
    transform-style:preserve-3d;
    transition:transform .75s cubic-bezier(.4,.15,.2,1);
  }
  .card-slot.flippable.flipped .card-inner{
    transform:rotateY(180deg);
  }
  .card-slot.flippable .card-face{
    position:absolute; inset:0;
    border-radius:3px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
    background:var(--paper);
    border:1px solid var(--ink);
    border-top:3px solid var(--cinnabar);
    box-shadow:0 3px 12px rgba(26,22,20,.12);
    transition:box-shadow .25s;
  }
  .card-slot.flippable:hover .card-face{
    box-shadow:0 8px 22px rgba(26,22,20,.18);
  }
  .card-slot.reversed .card-face{
    border-top-color:var(--ink);
    background-image:repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(26,22,20,.035) 6px, rgba(26,22,20,.035) 7px);
  }
  .card-slot.t-liuyao .card-face{ border-top-color:var(--ink); }
  .card-slot.t-bagua  .card-face{ border-top-color:var(--gold); }
  .card-slot.t-xiu    .card-face{ border-top-color:var(--gold); }
  .card-slot.t-number .card-face{ border-top-color:var(--gold); }
  .card-slot.t-answer .card-face{ border-top-color:var(--ink); }
  .card-slot.t-message .card-face{ border-top-color:var(--cinnabar); }

  .card-slot.simple .card-face{
    position:relative;
    width:100%; height:100%;
    border-radius:3px;
    overflow:hidden;
    background:var(--paper);
    border:1px solid var(--ink);
    border-top:3px solid var(--cinnabar);
    box-shadow:0 3px 12px rgba(26,22,20,.12);
  }
  .card-slot.t-answer.simple .card-face{ border-top-color:var(--ink); }
  .card-slot.t-number.simple .card-face{ border-top-color:var(--gold); }
  .card-slot.t-message.simple .card-face{ border-top-color:var(--cinnabar); }

  .card-back{
    transform:rotateY(180deg);
    background:var(--paper-back) !important;
    border-top-color:var(--ink) !important;
    display:flex; flex-direction:column;
  }
  .card-slot.reversed .card-back{
    background-image:repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(26,22,20,.03) 6px, rgba(26,22,20,.03) 7px) !important;
  }
  .back-scroll{
    flex:1;
    overflow-y:auto;
    padding:12px 11px 14px;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .back-scroll::-webkit-scrollbar{ width:3px; }
  .back-scroll::-webkit-scrollbar-thumb{ background:var(--ink-soft); border-radius:2px; }
  .back-scroll::-webkit-scrollbar-track{ background:transparent; }

  .bk-name{
    font-family:var(--serif);
    font-size:13.5px; font-weight:700;
    letter-spacing:.04em;
    color:var(--ink);
    margin-bottom:3px;
    text-align:center;
    line-height:1.35;
  }
  .bk-tags{
    font-family:var(--serif);
    font-size:9px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:7px;
    padding-bottom:7px;
    border-bottom:1px dashed var(--ink-line);
    line-height:1.55;
  }
  .bk-meta{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:2px 8px;
    font-family:var(--serif);
    font-size:9.5px;
    line-height:1.6;
    color:var(--ink-mid);
    padding:6px 0 8px;
    border-bottom:1px dashed var(--ink-line);
    margin-bottom:8px;
  }
  .bk-meta .k{
    color:var(--cinnabar);
    white-space:nowrap;
  }
  .bk-sec{
    font-family:var(--serif);
    font-size:9.5px; font-weight:700;
    letter-spacing:.12em;
    color:var(--cinnabar);
    margin:8px 0 3px;
    display:flex; align-items:center; gap:5px;
  }
  .bk-sec::before{
    content:"";
    width:3px; height:9px;
    background:var(--cinnabar);
    border-radius:1px;
    flex:none;
  }
  .bk-text{
    font-family:var(--serif);
    font-size:11px;
    line-height:1.72;
    color:var(--ink-mid);
    letter-spacing:.02em;
    margin:0;
  }
  .card-front{
    display:flex; flex-direction:column;
    padding:13px 11px 12px;
    text-align:center;
    height:100%;
  }
  .card-slot.simple .card-front{
    justify-content:center;
    align-items:center;
    padding:20px 14px;
  }
  .card-head{
    display:flex; justify-content:space-between; align-items:center;
    gap:4px;
    font-family:var(--serif);
    font-size:8.5px; letter-spacing:.06em;
    color:var(--ink-soft);
    padding-bottom:8px;
    border-bottom:1px dashed var(--ink-line);
    margin-bottom:9px;
    flex:none;
  }
  .card-head .deck{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pos{
    flex:none;
    font-size:8.5px;
    color:var(--cinnabar);
    letter-spacing:.08em;
  }
  .card-slot.reversed .pos{ color:var(--ink-mid); }
  .sym{
    display:flex; align-items:center; justify-content:center;
    flex:1;
    font-size:38px; line-height:1;
    color:var(--ink);
    font-family:var(--symbol);
    transition:transform .55s ease;
  }
  .card-slot.reversed .sym{ transform:rotate(180deg); }
  .sym img{
    max-width:110px;
    max-height:110px;
    width:auto; height:auto;
    object-fit:contain;
    border-radius:2px;
  }
  .sym .emoji{ display:inline-block; }
  .cname{
    flex:none;
    font-family:var(--serif);
    font-size:14.5px; font-weight:700;
    letter-spacing:.05em;
    color:var(--ink);
    margin-bottom:3px;
    line-height:1.3;
  }
  .csub{
    flex:none;
    font-family:var(--serif);
    font-size:8.5px;
    letter-spacing:.12em;
    color:var(--ink-soft);
  }
  .fhint{
    flex:none;
    margin-top:8px;
    font-family:var(--serif);
    font-size:8.5px;
    letter-spacing:.22em; text-indent:.22em;
    color:var(--ink-soft);
    opacity:.7;
  }
  .big{
    font-family:var(--serif);
    font-size:26px; font-weight:700;
    letter-spacing:.18em; text-indent:.18em;
    color:var(--ink);
    margin-bottom:10px;
  }
  .big.num{
    font-family:Georgia,"Times New Roman",serif;
    font-size:52px; font-weight:700; line-height:1;
    color:var(--gold);
    letter-spacing:0; text-indent:0;
  }
  .card-slot.t-message .big{
    font-size:16px;
    letter-spacing:.1em; text-indent:.1em;
    line-height:1.7;
    color:var(--cinnabar);
    max-width:180px;
  }
  .tag{
    font-family:var(--serif);
    font-size:9px; letter-spacing:.32em; text-indent:.32em;
    color:var(--ink-soft);
  }
  footer{
    padding:14px 20px calc(18px + env(safe-area-inset-bottom));
    border-top:1px solid var(--ink-line);
    background:var(--paper);
    position:relative;
    z-index:2;
  }
  footer::before{
    content:"";
    position:absolute; left:20px; right:20px; top:-1px; height:1px;
    background:linear-gradient(90deg, transparent, var(--cinnabar) 30%, var(--cinnabar) 70%, transparent);
    opacity:.4;
  }
  form{ display:flex; gap:10px; }
  #input{
    flex:1; min-width:0;
    padding:12px 16px;
    font-size:16px;
    font-family:var(--serif);
    letter-spacing:.06em;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--ink-line);
    border-radius:2px;
    outline:none;
    transition:border-color .2s;
  }
  #input::placeholder{ color:var(--ink-soft); }
  #input:focus{ border-color:var(--ink); }
  #input:disabled{ opacity:.5; }
  #send{
    flex:none;
    padding:0 22px;
    font-family:var(--serif);
    font-size:15px; font-weight:700; letter-spacing:.16em; text-indent:.16em;
    color:var(--paper);
    cursor:pointer;
    background:var(--cinnabar);
    border:none; border-radius:2px;
    transition:filter .2s, transform .2s;
    touch-action:manipulation;
  }
  #send:hover{ filter:brightness(1.12); }
  #send:active{ transform:scale(.97); }
  #send:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

  .filter-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(10,8,6,.4);
    backdrop-filter:blur(4px);
    display:grid;
    place-items:center;
    animation:fadeIn .22s ease both;
    padding:20px;
  }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .filter-menu{
    width:min(340px, 88vw);
    background:var(--paper);
    border:1px solid var(--cinnabar);
    border-top:4px solid var(--cinnabar);
    border-radius:4px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    padding:16px 14px 14px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    animation:popIn .3s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes popIn{
    from{ opacity:0; transform:translateY(-8px) scale(.95); }
    to{ opacity:1; transform:none; }
  }
  .filter-title{
    grid-column:1 / -1;
    text-align:center;
    font-family:var(--serif);
    font-size:11.5px;
    letter-spacing:.32em; text-indent:.32em;
    color:var(--cinnabar);
    padding-bottom:11px;
    margin-bottom:4px;
    border-bottom:1px dashed var(--ink-line);
  }
  .filter-option{
    padding:13px 8px;
    font-family:var(--serif);
    font-size:13px;
    letter-spacing:.14em;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--ink-line);
    border-radius:2px;
    cursor:pointer;
    transition:all .18s;
    text-align:center;
    touch-action:manipulation;
  }
  .filter-option:hover{
    background:var(--cinnabar-soft);
    border-color:var(--cinnabar);
    color:var(--cinnabar);
  }
  .filter-option.active{
    background:var(--cinnabar);
    color:var(--paper);
    border-color:var(--cinnabar);
  }
  .filter-option.active:hover{
    filter:brightness(1.05);
  }

  @media (max-width:420px){
    header{ padding:20px 20px 18px; }
    .seal{ width:28px; height:28px; font-size:13px; top:46px; left:20px; }
    .header-top{ font-size:11px; margin-bottom:24px; }
    header h1{ font-size:23px; letter-spacing:.4em; text-indent:.4em; }
    .meta{ font-size:10.5px; }
    .sub{ font-size:8px; letter-spacing:.16em; }
    .card-slot{ width:138px; height:232px; }
    .sym{ font-size:32px; }
    .sym img{ max-width:96px; max-height:96px; }
    .cname{ font-size:13px; }
    .back-scroll{ padding:11px 10px 12px; }
    .bk-name{ font-size:12.5px; }
    .bk-text{ font-size:10.5px; }
    .bk-meta{ font-size:9px; }
    .big{ font-size:23px; }
    .big.num{ font-size:46px; }
    .card-slot.t-message .big{ font-size:14px; }
    .bg-phrase span{ font-size:clamp(38px, 10vw, 62px); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="bg-phrase" id="bgPhrase" aria-hidden="true">
    <span>如日之升</span>
    <span>如月之恒</span>
  </div>

  <header id="header">
    <div class="header-top">
      <span>道</span><span>炁</span><span>长</span><span>存</span><span>，</span><span>九</span><span>星</span><span>护</span><span>佑</span>
    </div>
    <div class="seal" id="sealBtn" title="点击选择抽牌类别">卜</div>
    <h1>THINK</h1>
    <p class="meta">金 · 木 · 水 · 火 · 土</p>
    <p class="sub">
      <span>love</span><span>·</span><span>believe</span><span>·</span><span>world</span>
    </p>
  </header>

  <main id="chat"></main>

  <footer>
    <form id="form" autocomplete="off" onsubmit="return false;">
      <input id="input" type="text" placeholder="写下你的问题…" />
      <button type="button" id="send">发送</button>
    </form>
  </footer>
</div>

<script>
/* =========================================================
   图片开关（塔罗 / 雷诺曼）
   ========================================================= */
const USE_IMAGES = false;
const IMG_EXT    = "jpg";

/* =========================================================
   1. 塔罗 · 大阿卡纳 22 张
   ========================================================= */
const TAROT_MAJOR = [
  { name:"愚者", sym:"🃏", astro:"天王星", elem:"风",
    keywords:"全新开始 · 大胆尝试 · 单纯无畏",
    up:"你现在站在一个新起点上，就像刚毕业、刚换工作、刚认识一个人。别想太多，带着好奇心先迈一步。你不必把所有事都计划好，走一步看一步也是可以的。",
    rev:"可能你有点冲动，想逃避责任；也可能你因为害怕改变，迟迟不敢动。先看清楚脚下有没有坑，再决定要不要跳。",
    all:"在塔罗里，「愚者」编号是 0，排在所有牌最前面，代表「还没开始、什么都有可能」。他像一个背着轻便行囊出门旅行的年轻人，什么都不怕，因为他知道——最重要的不是准备好了没有，而是愿不愿意出发。它对应的天象是天王星（代表突然、打破常规），属性是「风」（代表想法、自由）。抽到这张牌，通常是在提醒你：别被过去的包袱拖住，新的路已经在你脚下了。" },
  { name:"魔术师", sym:"🎩", astro:"水星", elem:"风",
    keywords:"能力具备 · 主动出手 · 把想法变成现实",
    up:"你手上其实已经具备了做成这件事的条件，可能你自己还没意识到。现在不是再准备的时候，是该动手的时候了。大胆表达、大胆去做，你会发现自己比想象中更有能力。",
    rev:"可能是能力被浪费了，计划落不了地，或者身边有人言行不一致，让你被牵着走。也可能只是沟通出了问题。先检查一下：是不是自己骗自己？",
    all:"「魔术师」编号是 1，是塔罗里代表「创造」的牌。牌面上他一手朝天、一手朝地，桌上摆着权杖、圣杯、宝剑、星币四样东西——代表他什么都不缺。他对应的天象是水星（代表沟通、思维、交易），属性是「风」。抽到这张牌，是在告诉你：你缺的不是条件，而是开口和动手。" },
  { name:"女祭司", sym:"🌙", astro:"月亮", elem:"水",
    keywords:"直觉 · 静下来听内心 · 有些答案不用问别人",
    up:"你现在需要的不是向外找答案，而是安静下来听听自己内心。直觉、梦境、反复出现的念头，都在给你提示。感情上可能有段还没挑明的关系，事业上先观察、先学习，不急着表态。",
    rev:"可能你忽略了直觉，被表面现象迷惑，或者压抑了真实感受。别急着向别人求证，先跟自己好好聊聊。",
    all:"「女祭司」编号是 2，是一位坐在两根柱子（一黑一白）之间的女性，代表她懂得「平衡」和「看透」。她对应的天象是月亮（代表潜意识、情绪、直觉），属性是「水」。她不说话，却知道一切。抽到这张牌，是宇宙在跟你说：现在不是发声的时候，是倾听的时候。" },
  { name:"皇后", sym:"🌷", astro:"金星", elem:"土",
    keywords:"丰盛 · 照顾与被照顾 · 让好事自然发生",
    up:"你的生活正在往好的方向生长。享受当下，照顾自己，也照顾身边的人。这是适合怀孕、做创作、投资自己的时期。别逼自己，允许美好自然到来。",
    rev:"可能你付出太多、太依赖别人，或者忽略了自己。先把自己照顾好，才有余力照顾别人。也可能创作卡壳、关系失衡。",
    all:"「皇后」编号是 3，是一位坐在麦田里、头戴星星冠冕的女性，代表大地的丰饶和母亲的滋养。她对应的天象是金星（代表爱、美、丰盛），属性是「土」（代表大地、物质、孕育）。她是塔罗里最包容的牌之一——她提醒你：真正的丰盛不是拼命去抓，而是允许自己接收。" },
  { name:"皇帝", sym:"🏛️", astro:"白羊座", elem:"火",
    keywords:"建立规则 · 承担责任 · 做自己的主人",
    up:"现在需要你站出来，把秩序建立起来。用理性、纪律去面对问题，你就是自己人生的主人。适合制定规则、签合同、明确边界。感情上可能遇到一位成熟稳重、有担当的人。",
    rev:"可能控制欲太强、太固执，或者逃避责任。权威不是压迫，而是保护与担当。也可能代表长辈、上司给你的压力。",
    all:"「皇帝」编号是 4，是一位坐在石座上、身穿铠甲、手握权杖的男性，代表结构、边界和阳刚的领导力。他对应的天象是白羊座（代表开创、行动、领导），属性是「火」。他是「父亲」的原型，代表规则与秩序。抽到他，说明此刻需要你站出来为自己的人生负责——不是去控制别人，而是担起自己的那份。" },
  { name:"教皇", sym:"📜", astro:"金牛座", elem:"土",
    keywords:"传统 · 找老师 · 跟着验证过的方法走",
    up:"这段时间适合学习、修身、跟随前人走过的路。可以找一位导师，或者加入一个靠谱的团体一起成长。感情上代表正统的承诺或婚姻。",
    rev:"可能你盲从权威、被条条框框绑住，或者对现有体系产生了怀疑。找到自己的信仰，而不是别人的。也可能代表伪善、只做表面功夫。",
    all:"「教皇」编号是 5，是一位坐在两根柱子之间、向信徒传递祝福与教导的人，代表传统智慧和精神的指引。他对应的天象是金牛座（代表稳固、务实、感官），属性是「土」。他是「老师」的原型，代表世代相传的知识。抽到他，是在提醒你：前人走过的路能让你少走弯路——但路终究还是要自己走。" },
  { name:"恋人", sym:"💞", astro:"双子座", elem:"风",
    keywords:"重要的关系 · 需要做选择 · 跟着价值观走",
    up:"你正面临一段重要的关系，或一个重大的选择。听从内心，选那个跟你价值观一致的方向。爱会给你力量。感情上代表深刻的连接，事业上代表需要取舍的重要决定。",
    rev:"可能关系失衡、选择困难，或者因为害怕而回避承诺。先弄清楚自己真正想要什么。也可能代表价值观冲突、遇到诱惑。",
    all:"「恋人」编号是 6，牌面上有天使、男人、女人和一棵树，代表纯真的结合与神圣的选择。它对应的天象是双子座（代表沟通、选择、二元），属性是「风」。它不仅指爱情，也代表人生的重大抉择。它其实在问你：你愿意为真正重要的事做出承诺吗？" },
  { name:"战车", sym:"🏇", astro:"巨蟹座", elem:"水",
    keywords:"意志力 · 向前冲 · 掌控方向",
    up:"凭意志力和专注往前冲，你能克服阻力取得胜利。关键是要掌控好方向，别一味蛮冲。感情上代表主动追求，事业上代表突破瓶颈。",
    rev:"可能方向失控、被情绪带着走，或者陷入拉锯。先稳住自己内在，再出发。也可能代表放弃、退缩、半途而废。",
    all:"「战车」编号是 7，牌面上一位武士驾驭着黑白两只斯芬克斯，代表对立力量的整合。它对应的天象是巨蟹座（代表保护、情感、家庭），属性是「水」。战车的动力来自月亮，象征从情感中汲取力量。抽到它，是在说：真正的强者，不是没有情绪，而是能驾驭情绪。" },
  { name:"力量", sym:"🦁", astro:"狮子座", elem:"火",
    keywords:"以柔克刚 · 耐心 · 驯服内心的恐惧",
    up:"用温柔而不是暴力去面对问题。你内在的力量足以驯服恐惧和冲动，耐心会带来最好的结果。感情上代表以柔克刚的智慧，事业上代表稳步推进。",
    rev:"可能自我怀疑、被情绪吞掉，或者过度逞强。真正的力量是柔软而坚定的。也可能代表身体虚弱、勇气不足。",
    all:"「力量」编号是 8，牌面上一位女子温柔地抚摸狮子，代表「以柔克刚」。她头顶有一个无限符号，代表源源不断的内在力量。它对应的天象是狮子座（代表勇气、威严、热情），属性是「火」。抽到她，是在提醒你：真正的强大，不是压倒别人，而是驯服自己。" },
  { name:"隐士", sym:"🕯️", astro:"处女座", elem:"土",
    keywords:"独处 · 向内寻找 · 沉淀",
    up:"现在适合退到安静的地方，独自想一想。答案需要往内找。独处不是孤独，而是充电和照见自己。感情上代表需要空间，事业上代表深耕。",
    rev:"可能过度封闭、逃避人群，或者感到孤单迷茫。独处是为了更好地回归人群。也可能代表拒绝别人的帮助。",
    all:"「隐士」编号是 9，一位独行在山顶的老人，手提灯笼，灯里是一颗六芒星——那是他内心的智慧之光。他不是在逃避，而是在寻找。它对应的天象是处女座（代表细致、服务、分析），属性是「土」。抽到他，是在提醒你：真正的智慧，来自安静的自省。" },
  { name:"命运之轮", sym:"🎡", astro:"木星", elem:"火",
    keywords:"变化来了 · 顺势而为 · 好运或转机",
    up:"命运正在转动，变化已经悄悄发生。顺着时势走，抓住时机，不用强求，一切自有安排。感情上代表缘分的聚散，事业上代表转机。",
    rev:"可能遇到停滞、倒霉，或者反复的挫折。低谷会过去，这时候适合守不适合攻。也可能代表抗拒改变、错过机会。",
    all:"「命运之轮」编号是 10，轮盘上有狮子、牛、鹰、天使四个活物，代表四种元素和四季的循环。轮子上下的人，代表顺境和逆境。它对应的天象是木星（代表扩张、幸运、机遇），属性是「火」。它想说：没有永远的好，也没有永远的坏——唯一不变的就是变化本身。" },
  { name:"正义", sym:"⚖️", astro:"天秤座", elem:"风",
    keywords:"公平 · 因果 · 做出理性判断",
    up:"事情会得到公正的结果。你种下什么因，就结什么果。保持诚实，做理性的判断。感情上代表关系里的公平，事业上代表合同、法律事务。",
    rev:"可能遭遇不公、逃避责任，或者判断失衡。先对自己诚实，才能得到公正。也可能代表法律纠纷、契约问题。",
    all:"「正义」编号是 11，牌面上一位女性手持天平与宝剑，代表衡量与裁决。天平代表客观，宝剑代表理性。它对应的天象是天秤座（代表平衡、公正、关系），属性是「风」。她提醒你：每一个选择，都是在为自己的未来投票。" },
  { name:"倒吊人", sym:"🙃", astro:"海王星", elem:"水",
    keywords:"暂停一下 · 换个角度看 · 放下执念",
    up:"停下来，换个角度看问题。现在的停滞不是惩罚，而是一次重新审视的机会。放下执念，反而能看到出路。感情上代表为爱牺牲，事业上代表换位思考。",
    rev:"可能白白牺牲、无谓拖延，或者困在没有意义的等待里。该放手时就放手。也可能代表拒绝改变、自我感动。",
    all:"「倒吊人」编号是 12，一个人倒挂在树上，头部发光，代表在停顿中获得启示。他不是被困住，而是自愿献出。它对应的天象是海王星（代表直觉、牺牲、消融），属性是「水」。抽到他，是在提醒你：有时候，暂停比前进更有力量。" },
  { name:"死神", sym:"💀", astro:"天蝎座", elem:"水",
    keywords:"结束 · 转变 · 放手 · 重生",
    up:"一个阶段结束了，新的正在到来。放手那些不再适合你的事物，清理之后才有空间迎接新的东西。感情上代表关系转变，事业上代表转型。",
    rev:"可能抗拒改变、拖延结束，或者反复纠缠旧事。死抓着过去，只会错过现在。也可能代表转变缓慢、卡住了。",
    all:"「死神」编号是 13，他骑着白马，手拿黑旗，旗上是象征新生的白玫瑰，远处太阳正在升起。他对应的天象是天蝎座（代表深刻、蜕变、生死），属性是「水」。他不是终结，而是转化——每一次告别，都是新生的开始。" },
  { name:"节制", sym:"🏺", astro:"射手座", elem:"火",
    keywords:"平衡 · 调和 · 不急不慢",
    up:"保持平衡，找到中间道路。不偏激，不极端，耐心调和各方面的需求，事情会自然走向圆满。感情上代表互补，事业上代表整合资源。",
    rev:"可能失衡、过度消耗，或者缺乏耐心。节奏太快或太慢，都需要调整。也可能代表走极端、冲突。",
    all:"「节制」编号是 14，一位天使一脚踏水、一脚踏地，手持两个杯子来回倒水，代表在意识和潜意识之间调和。它对应的天象是射手座（代表追求、理想、远方），属性是「火」。她在告诉你：过犹不及，恰到好处才是智慧。" },
  { name:"恶魔", sym:"😈", astro:"摩羯座", elem:"土",
    keywords:"被什么困住了 · 欲望 · 看见自己的阴影",
    up:"你可能被某种欲望、习惯或者关系困住了。看清楚是什么在绑着你，承认它，就是解脱的第一步。感情上代表执念或诱惑，事业上代表利益的捆绑。",
    rev:"可能正在挣脱束缚、看清真相，或者终于从执念中走出来。这是一次重要的觉醒。也可能代表诱惑散去、重获自由。",
    all:"「恶魔」编号是 15，牌面上恶魔掌控着被锁链拴住的一男一女，但锁链是松的——真正的束缚，是自己套上的。它对应的天象是摩羯座（代表野心、欲望、物质），属性是「土」。他提醒你：看见阴影，才能不被它控制。" },
  { name:"高塔", sym:"🗼", astro:"火星", elem:"火",
    keywords:"突然的剧变 · 旧结构崩塌 · 觉醒",
    up:"一个突然的剧变正在发生。旧的崩塌看似灾难，其实是为了给真实腾出空间。接受变化，重建会更坚固。感情上代表关系剧变，事业上代表突发状况。",
    rev:"可能避免了灾难，或者内在已经开始瓦解。别硬撑，顺势而为才安全。也可能代表延缓的崩塌、内在的觉醒。",
    all:"「高塔」编号是 16，高塔被闪电击中，火焰四射，人们坠落。它象征旧结构的崩塌和觉醒的瞬间。它对应的天象是火星（代表行动、冲突、破坏），属性是「火」。崩塌之后，你才看清什么是真正的根基。" },
  { name:"星星", sym:"⭐", astro:"水瓶座", elem:"风",
    keywords:"希望 · 疗愈 · 相信光在前面",
    up:"黑暗过后，星光依旧。保持希望，相信自己的方向，疗愈正在发生。这是平静而充满力量的时期。感情上代表温柔的期待，事业上代表灵感的指引。",
    rev:"可能失去信心、感到迷茫，或者对疗愈过程感到疲惫。别放弃，曙光就在前方。也可能代表灵感枯竭、方向不明。",
    all:"「星星」编号是 17，一位女子在星空下汲水，一只脚在水中，一只脚在地上，代表意识与物质的连接。她把水倒向大地和水池，象征疗愈的传递。它对应的天象是水瓶座（代表理想、希望、博爱），属性是「风」。即便世界黑暗，你依然可以选择相信光。" },
  { name:"月亮", sym:"🌜", astro:"双鱼座", elem:"水",
    keywords:"看不清 · 内心不安 · 等待迷雾散开",
    up:"看不清全貌，内心充满疑虑和不安。现在的恐惧多半来自想象。先别下结论，等迷雾散去。感情上代表暧昧不清，事业上代表信息不明。",
    rev:"可能真相逐渐浮出水面，恐惧散去，或者从迷茫中走出来。信任直觉，但别被它吓到。也可能代表幻灭、看清真相。",
    all:"「月亮」编号是 18，牌面上有狗、狼和螯虾，从不同深度浮出水面，代表潜意识里的恐惧和本能。月亮的光是反射的。它对应的天象是双鱼座（代表梦幻、直觉、消融），属性是「水」。它提醒你：最深的不安，往往在等你去看见和理解。" },
  { name:"太阳", sym:"☀️", astro:"太阳", elem:"火",
    keywords:"喜悦 · 成功 · 光明正大 · 做自己",
    up:"阳光普照，一切清晰明了。享受成功和快乐，大胆展现自己。这是充满活力和好运的时期。感情上代表幸福圆满，事业上代表成果显现。",
    rev:"可能暂时被阴云遮住，或者缺乏自信。太阳一直都在，只是需要一点时间穿透云层。也可能代表成功延迟、太内敛。",
    all:"「太阳」编号是 19，牌面上一个赤裸的孩子骑在白马上，向日葵向着太阳生长，代表纯真、喜悦与生命力。它对应的天象是太阳本身，属性是「火」。太阳是塔罗最积极的牌之一——它在说：生命本该明亮灿烂，允许自己快乐吧。" },
  { name:"审判", sym:"📯", astro:"冥王星", elem:"水",
    keywords:"觉醒 · 重新出发 · 宽恕过去",
    up:"一个重要的觉醒时刻。你被召唤去面对过去、做出决定、重新出发。宽恕自己和别人，然后重生。感情上代表旧关系的新生，事业上代表重生的机会。",
    rev:"可能逃避评判、深陷自责，或者迟迟不愿翻篇。过去的事，不必再反复审判。也可能代表拖延、拒绝成长。",
    all:"「审判」编号是 20，天使吹响号角，逝者从棺中起身，象征灵魂的觉醒与复活。它对应的天象是冥王星（代表转化、重生、深层力量），属性是「水」。这不是审判，而是一份邀请——去成为真正的自己。" },
  { name:"世界", sym:"🌍", astro:"土星", elem:"土",
    keywords:"圆满完成 · 达成目标 · 准备下一段",

/* =========================================================
   8. 抽牌筛选
   默认使用六爻
   ========================================================= */
let currentFilter = "liuyao";

const FILTER_LABELS = {
  tarot: "塔罗牌",
  lenormand: "雷诺曼",
  liuyao: "六爻",
  xiu: "28 宿",
  bagua: "太极八卦",
  other: "其他"
};

function getFilteredPool(){
  if (currentFilter === "other") {
    /* 「其他」= 除了塔罗、雷诺曼、六爻、28 宿、太极八卦之外的剩余预设卡
       也就是：答案、数字、字卡 */
    return DECK.filter(function(c){
      return c.type !== "tarot" &&
             c.type !== "lenormand" &&
             c.type !== "liuyao" &&
             c.type !== "xiu" &&
             c.type !== "bagua";
    });
  }
  return DECK.filter(function(c){ return c.type === currentFilter; });
}

function drawOne(){
  const pool = getFilteredPool();
  if (!pool.length) return null;

  let total = 0;
  for (let i = 0; i < pool.length; i++) total += pool[i].weight;

  let r = Math.random() * total;
  let picked = pool[0];
  for (let i = 0; i < pool.length; i++) {
    r -= pool[i].weight;
    if (r <= 0) { picked = pool[i]; break; }
  }

  const card = Object.assign({}, picked);
  if (card.type === "tarot" || card.type === "lenormand") {
    card.reversed = Math.random() < 0.5;
  }
  return card;
}

function drawCards(){
  const count = 1 + Math.floor(Math.random() * 3);
  const list = [];
  for (let i = 0; i < count; i++) {
    const c = drawOne();
    if (c) list.push(c);
  }
  return list;
}

function escapeHTML(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function symHTML(card){
  const emoji = '<span class="emoji">' + escapeHTML(card.sym) + '</span>';
  if (card.type === "liuyao" || card.type === "bagua" || card.type === "xiu") return emoji;
  if (!USE_IMAGES || !card.img) return emoji;
  return (
    '<img src="' + card.img + '" alt="' + escapeHTML(card.name) + '" ' +
    'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-block\';" />' +
    '<span class="emoji" style="display:none">' + escapeHTML(card.sym) + '</span>'
  );
}

  html += '<div class="bk-name">' + escapeHTML(card.name) + '</div>';
  html += '<div class="bk-tags">' + escapeHTML(card.keywords || '') + '</div>';

  let meta = '';
  if (card.type === "tarot") {
    meta += '<span class="k">对应天象</span><span>' + escapeHTML(card.astro) + '</span>';
    meta += '<span class="k">元素</span><span>' + escapeHTML(card.elem) + '</span>';
    if (card.season) meta += '<span class="k">季节</span><span>' + escapeHTML(card.season) + '</span>';
  } else if (card.type === "lenormand") {
    if (card.num) meta += '<span class="k">编号</span><span>第 ' + escapeHTML(card.num) + ' 号</span>';
    meta += '<span class="k">扑克牌</span><span>' + escapeHTML(card.poker) + '</span>';

    meta += '<span class="k">所属宫</span><span>' + escapeHTML(card.palace) + '</span>';

    meta += '<span class="k">上下卦</span><span>' + escapeHTML(card.upper) + ' / ' + escapeHTML(card.lower) + '</span>';
    if (card.guaCi) meta += '<span class="k">卦辞</span><span>' + escapeHTML(card.guaCi) + '</span>';

  } else if (card.type === "bagua") {
    meta += '<span class="k">五行</span><span>' + escapeHTML(card.elem) + '</span>';

    meta += '<span class="k">季节</span><span>' + escapeHTML(card.season) + '</span>';
  } else if (card.type === "xiu") {
    meta += '<span class="k">编号</span><span>第 ' + escapeHTML(card.num) + ' 宿</span>';
    meta += '<span class="k">四象</span><span>' + escapeHTML(card.group) + '</span>';
    meta += '<span class="k">动物</span><span>' + escapeHTML(card.animal) + '</span>';
    meta += '<span class="k">五行</span><span>' + escapeHTML(card.elem) + '</span>';
    meta += '<span class="k">吉凶</span><span>' + escapeHTML(card.luck) + '</span>';
  }
  if (meta) html += '<div class="bk-meta">' + meta + '</div>';

  if (card.type === "tarot" || card.type === "lenormand") {
    html += '<div class="bk-sec">正位（顺的时候）</div><p class="bk-text">' + escapeHTML(card.up) + '</p>';
    html += '<div class="bk-sec">逆位（不顺的时候）</div><p class="bk-text">' + escapeHTML(card.rev) + '</p>';
  } else if (card.type === "liuyao" || card.type === "bagua") {
    html += '<div class="bk-sec">卦象</div><p class="bk-text">' + escapeHTML(card.up) + '</p>';

function frontFlippable(card){
  let head = '';
  if (card.type === "tarot" || card.type === "lenormand") {
    head =
      '<div class="card-head">' +
        '<span class="deck">' + escapeHTML(card.deck) + '</span>' +
        '<span class="pos">' + (card.reversed ? "逆位" : "正位") + '</span>' +
      '</div>';
  } else if (card.type === "liuyao") {
    head =
      '<div class="card-head">' +
        '<span class="deck">六爻 · ' + escapeHTML(card.palace) + '</span>' +
        '<span class="pos">' + escapeHTML(card.elem) + '</span>' +
      '</div>';
  } else if (card.type === "bagua") {
    head =
      '<div class="card-head">' +
        '<span class="deck">八卦 · ' + escapeHTML(card.direction) + '</span>' +
        '<span class="pos">' + escapeHTML(card.elem) + '</span>' +
      '</div>';
  } else if (card.type === "xiu") {
    head =
      '<div class="card-head">' +
        '<span class="deck">星宿 · ' + escapeHTML(card.group) + '</span>' +
        '<span class="pos">' + escapeHTML(card.luck) + '</span>' +
      '</div>';
  }
  return head +
    '<div class="sym">' + symHTML(card) + '</div>' +
    '<div class="cname">' + escapeHTML(card.name) + '</div>' +
    '<div class="csub">' + escapeHTML(card.sub) + '</div>' +
    '<div class="fhint">轻触翻牌</div>';
}

function frontSimple(card){
  if (card.type === "answer") {
    return '<div class="big">' + escapeHTML(card.name) + '</div><div class="tag">答 案</div>';
  }
  if (card.type === "number") {
    return '<div class="big num">' + escapeHTML(card.name) + '</div><div class="tag">数 字</div>';
  }
  return '<div class="big">' + escapeHTML(card.name) + '</div><div class="tag">提 示</div>';
}

function makeCard(card){
  const flippable = (card.type === "tarot" || card.type === "lenormand" ||
                     card.type === "liuyao" || card.type === "bagua" ||
                     card.type === "xiu");

  const slot = document.createElement("div");
  slot.className = "card-slot t-" + card.type +
                   (card.reversed ? " reversed" : "") +
                   (flippable ? " flippable" : " simple");

  if (flippable) {
    slot.innerHTML =
      '<div class="card-inner">' +
        '<div class="card-face card-front">' + frontFlippable(card) + '</div>' +
        '<div class="card-face card-back"><div class="back-scroll">' + backHTML(card) + '</div></div>' +
      '</div>';

    let startX = 0, startY = 0, moved = false;

    slot.addEventListener("touchstart", function(e){
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
      moved = false;
    }, { passive: true });

    slot.addEventListener("touchmove", function(e){
      const t = e.touches[0];
      if (Math.abs(t.clientX - startX) > 8 || Math.abs(t.clientY - startY) > 8) {
        moved = true;
      }
    }, { passive: true });

    slot.addEventListener("mousedown", function(e){
      startX = e.clientX;
      startY = e.clientY;
      moved = false;
    });

    slot.addEventListener("mousemove", function(e){
      if (e.buttons === 0) return;
      if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) {
        moved = true;
      }
    });

    slot.addEventListener("click", function(e){
      if (moved) { moved = false; return; }
      slot.classList.toggle("flipped");
    });

  } else {
    slot.innerHTML =
      '<div class="card-face card-front">' + frontSimple(card) + '</div>';
  }

  return slot;
}

function openFilterMenu(){
  const existing = document.querySelector(".filter-overlay");
  if (existing) { existing.remove(); return; }

  const overlay = document.createElement("div");
  overlay.className = "filter-overlay";

  const menu = document.createElement("div");
  menu.className = "filter-menu";

  const title = document.createElement("div");
  title.className = "filter-title";
  title.textContent = "请选择抽牌类别";
  menu.appendChild(title);

  const options = [
    { key:"tarot",    label:"塔罗牌" },
    { key:"lenormand",label:"雷诺曼" },
    { key:"liuyao",   label:"六爻" },
    { key:"xiu",      label:"28 宿" },
    { key:"bagua",    label:"太极八卦" },
    { key:"other",    label:"其他" }
  ];

  options.forEach(function(opt){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "filter-option" + (currentFilter === opt.key ? " active" : "");
    btn.textContent = opt.label;
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      currentFilter = opt.key;
      overlay.remove();
      addNotice("已切换到 · <b>" + FILTER_LABELS[opt.key] + "</b> · 后续只出这一类");
    });
    menu.appendChild(btn);
  });

  overlay.appendChild(menu);
  overlay.addEventListener("click", function(){
    overlay.remove();
  });

  document.querySelector(".app").appendChild(overlay);
}

sealBtn.addEventListener("click", function(e){

/* =========================================================
   13. 发送逻辑
   ========================================================= */
function doSend(){
  try {
    const text = (input.value || "").trim();
    if (!text) return;
    if (busy) return;

    addUserBubble(text);
    input.value = "";
    busy = true;
    input.disabled = true;
    send.disabled = true;

    const typingRow = addTyping();
    const delay = Math.random() * 60000;

    setTimeout(function(){
      try {
        typingRow.remove();
        addSysCards(drawCards());
      } catch (err) {
        addError("抽牌出错：" + err.message);
      } finally {
        busy = false;
        input.disabled = false;
        send.disabled = false;
        try { input.focus(); } catch(e){}
      }
    }, delay);

  } catch (err) {
    busy = false;
    input.disabled = false;
    send.disabled = false;
    addError("发送出错：" + err.message);
  }
}

send.addEventListener("click", function(e){
  e.preventDefault();
  doSend();
});
form.addEventListener("submit", function(e){
  e.preventDefault();
  doSend();
});
input.addEventListener("keydown", function(e){
  if (e.key === "Enter" || e.keyCode === 13) {
    e.preventDefault();
    doSend();
  }
});

window.addEventListener("load", function(){
  if (!chat || !input || !send || !form) {
    document.body.innerHTML =
      '<p style="color:#a63327;padding:20px;font-size:14px;font-family:serif;">' +
      '页面元素加载不完整，请刷新重试。</p>';
    return;
  }
  positionBgPhrase();
  if (window.matchMedia("(min-width: 700px)").matches) {
    try { input.focus(); } catch(e){}
  }
});

window.addEventListener("resize", function(){
  positionBgPhrase();
});
</script>
</body>
</html>
